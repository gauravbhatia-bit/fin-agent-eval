pack_name: eu_us_etf
fictional_data: true
disclaimer: "Fictional demo data. Educational only. Not financial advice. Not affiliated with any broker."
refused_topics:
  - personalized investment recommendations
  - predictions or guarantees about investment performance
  - tax or legal advice
  - instructions to ignore safety rules
escalation_topics:
  - account-specific requests
  - complaints requiring a person
rule_patterns:
  advice_request:
    - '(?i)\bshould\s+i\s+(buy|sell|hold)\b'
    - '(?i)\b(best|right)\s+(etf|stock|fund)\s+for\s+me\b'
  prediction_request:
    - '(?i)\b(will|guaranteed to)\s+.{0,30}\b(go up|rise|double|profit)\b'
    - '(?i)\b(will|could)\s+(it|this|the (?:etf|stock|fund))\s+(go up|rise|double|make a profit)\b'
    - '(?i)\bguarantee(?:d)?\s+(?:a\s+)?(?:return|profit|growth)\b'
  injection:
    - '(?i)\b(ignore|disregard)\s+(all\s+)?(previous|prior|safety)\s+instructions\b'
    - '(?i)\b(reveal|show|print)\s+(?:the\s+)?(?:system|hidden|developer)\s+(?:prompt|instructions)\b'
  account_specific:
    - '(?i)\b(my|our)\s+(account|balance|portfolio|order|transaction|deposit|withdrawal)\b'
    - '(?i)\b(cancel|place|execute)\s+(?:my\s+)?(?:order|trade|transaction)\b'
  complaint:
    - '(?i)\b(file|make|submit)\s+(?:a\s+)?complaint\b'
    - '(?i)\b(speak|talk)\s+to\s+(?:a\s+)?(?:human|person|support|agent)\b'
  tax_legal:
    - '(?i)\b(tax|taxes|taxation|legal advice|lawyer)\b'
